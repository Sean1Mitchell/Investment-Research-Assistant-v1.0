<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Investment Research Assistant (IRA)</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <h2>Research Assistant</h2>
            <ul>
                <li><a href="/">Dashboard</a></li>
                <li><a href="/companies">Companies</a></li>
                <li><a href="/verification" class="active">Verification Queue</a></li>
                <li><a href="/company-view">Company View</a></li>
                <li><a href="/compare">Compare</a></li>
                <li><a href="/account">Account &amp; Settings</a></li>
            </ul>
        </nav>

        <main class="content">
            <h1>Verification Queue</h1>

            <select id="company-select">
                <option value="1">TESCO PLC</option>
                <option value="2">J SAINSBURY PLC</option>
            </select>

            <div class="verification-layout">
                <div class="document-panel">
                    <h3>Source Document</h3>
                    <embed id="source-pdf" src="" type="application/pdf" width="100%" height="600px">
                </div>

                <div class="figures-panel">
                    <h3>Extracted Figures</h3>
                    <table id="figures-table">
                        <thead>
                            <tr>
                                <th>Statement</th>
                                <th>Line Item</th>
                                <th>Year</th>
                                <th>Extracted Value</th>
                                <th>Corrected Value</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="figures-body">
                            <!-- Rows inserted here by JS -->
                        </tbody>
                    </table>
                    <button id="add-row-btn">+ Add Missing Line Item</button>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
